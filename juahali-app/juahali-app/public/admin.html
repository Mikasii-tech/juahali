<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JUAHALI | Admin</title>
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/staff.css" />
    <link rel="stylesheet" href="/admin.css" />
    <script src="/charts.js" defer></script>
    <script src="/admin.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <a class="logo" href="/admin"
          ><svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="#C4232F" />
            <path
              d="M18 10v16M10 18h16"
              stroke="#fff"
              stroke-width="3.2"
              stroke-linecap="round"
            /></svg
          ><span>JUAHALI</span></a
        >
        <nav id="nav" aria-label="Admin menu">
          <a href="#/reports" data-r="reports"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg
            ><span>Reports</span></a
          >
          <a href="#/users" data-r="users"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"
              /></svg
            ><span>Users</span></a
          >
          <a href="#/ai" data-r="ai"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"
              /></svg
            ><span>AI model</span></a
          >
        </nav>
        <div class="side-foot">
          <span id="savatar" class="avatar" aria-hidden="true"></span>
          <div><b id="sname">Admin</b><small>Administrator</small></div>
          <button
            id="logout"
            class="icon-btn"
            type="button"
            aria-label="Log out"
            title="Log out"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
              />
            </svg>
          </button>
        </div>
      </aside>
      <div class="main">
        <header class="top">
          <a class="logo mlogo" href="/admin"
            ><svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#C4232F" />
              <path
                d="M18 10v16M10 18h16"
                stroke="#fff"
                stroke-width="3.2"
                stroke-linecap="round"
              /></svg
            ><span>JUAHALI</span></a
          >
          <h2 id="ptitle">Reports</h2>
          <div class="top-r">
            <button
              id="theme"
              class="icon-btn"
              type="button"
              aria-label="Switch light and dark mode"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </button>
            <span id="chip" class="avatar" aria-hidden="true"></span>
          </div>
        </header>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
