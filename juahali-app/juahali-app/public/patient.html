<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JUAHALI | Patient</title>
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/charts.js" defer></script>
    <script src="/patient.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <a class="logo" href="/index.html"
          ><svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="#C4232F" />
            <path
              d="M18 10v16M10 18h16"
              stroke="#fff"
              stroke-width="3.2"
              stroke-linecap="round"
            /></svg
          ><span>JUAHALI</span></a
        >
        <nav id="nav" aria-label="Patient menu">
          <a href="#/home" data-r="home"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
              /></svg
            ><span>Home</span></a
          >
          <a href="#/checkin" data-r="checkin"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" /></svg
            ><span>Check in</span></a
          >
          <a href="#/visits" data-r="visits"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"
              /></svg
            ><span>My visits</span></a
          >
          <a href="#/insights" data-r="insights"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg
            ><span>Insights</span></a
          >
          <a href="#/help" data-r="help" class="hide-m"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 1-1 1.7M12 17h.01" /></svg
            ><span>Help</span></a
          >
          <a href="#/profile" data-r="profile"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"
              /></svg
            ><span>Profile</span></a
          >
        </nav>
        <div class="side-foot">
          <span id="savatar" class="avatar" aria-hidden="true"></span>
          <div><b id="sname">Patient</b><small id="smail"></small></div>
          <button
            id="logout"
            class="icon-btn"
            type="button"
            aria-label="Log out"
            title="Log out"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
              />
            </svg>
          </button>
        </div>
      </aside>
      <div class="main">
        <header class="top">
          <a class="logo mlogo" href="/index.html"
            ><svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#C4232F" />
              <path
                d="M18 10v16M10 18h16"
                stroke="#fff"
                stroke-width="3.2"
                stroke-linecap="round"
              /></svg
            ><span>JUAHALI</span></a
          >
          <h2 id="ptitle">Dashboard</h2>
          <div class="top-r">
            <span id="live" class="live"
              ><i></i><em id="livetxt">Live</em></span
            >
            <button
              id="theme"
              class="icon-btn"
              type="button"
              aria-label="Switch light and dark mode"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </button>
            <a
              id="chip"
              class="avatar"
              href="#/profile"
              aria-label="Open profile"
            ></a>
          </div>
        </header>
        <div id="called" class="called" role="alert" hidden></div>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
